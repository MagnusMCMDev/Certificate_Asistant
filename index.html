<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Acceso</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body class="study-body">

  
  <section id="login-screen" class="login-screen">
    <form id="login-form" class="login-card" autocomplete="off">
      <h1>🔒 Acceso</h1>
      <label class="login-field">Usuario
        <input id="login-user" type="text" autocomplete="username" autofocus>
      </label>
      <label class="login-field">Contraseña
        <input id="login-pass" type="password" autocomplete="current-password">
      </label>
      <button id="login-btn" type="submit" class="btn-primary big-btn">Entrar</button>
      <p id="login-error" class="login-error" role="alert"></p>
    </form>
  </section>

  
  <div id="app" hidden>
    <header class="study-topbar">
      <div class="study-brand"><a href="#/" id="brand-link"></a></div>
      <span id="app-user" class="app-user"></span>
      <button id="logout-btn" type="button" class="manage-btn">Salir</button>
    </header>
    <main id="app-main" class="study-main"></main>
    <footer class="study-footer"><small id="app-footer"></small></footer>
  </div>

  
  <script src="./js/widget.js"></script>
  <script src="./js/study_widget.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
